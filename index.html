<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldZeit - Advanced Core // Completo</title>
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: #111115;
            --border-color: #22222d;
            --accent-green: #00ffcc;
            --accent-gold: #ffd700;
            --accent-warn: #ff4444;
            --accent-era: #b8c2cc;
            --text-main: #d0d0d6;
        }
        body {
            margin: 0; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; box-sizing: border-box; height: 100vh; overflow: hidden;
        }
        header {
            text-align: center; margin-bottom: 10px; display: flex;
            justify-content: space-between; width: 100%; max-width: 1000px; align-items: center;
        }
        h1 { margin: 0; font-size: 16px; color: var(--accent-green); letter-spacing: 2px; text-transform: uppercase; }
        .dashboard {
            display: flex; gap: 15px; background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 8px 15px; border-radius: 6px; font-size: 12px; font-weight: bold;
            margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); justify-content: center;
            width: 100%; max-width: 1000px; flex-wrap: wrap;
        }
        .resource-item span { color: var(--accent-gold); }
        .era-item { color: var(--accent-era); font-size: 14px; }
        .game-area { display: flex; gap: 10px; width: 100%; max-width: 1000px; flex-grow: 1; max-height: 600px; }
        .canvas-container {
            position: relative; overflow: hidden; border: 2px solid var(--border-color);
            background: #0d0d11; border-radius: 6px; box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            flex-grow: 1; display: flex; justify-content: center; align-items: center; cursor: crosshair;
        }
        canvas { display: block; transform-origin: 0 0; }
        .sidebar { width: 280px; display: flex; flex-direction: column; gap: 10px; transition: all 0.3s ease; }
        .sidebar.hidden { display: none; }
        .control-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px;
            padding: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 5px;
            flex-grow: 1; overflow-y: auto; max-height: 400px;
        }
        .control-panel strong {
            color: var(--accent-green); border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px; margin-bottom: 4px; text-align: center; display: block; margin-top: 5px;
        }
        button { width: 100%; box-sizing: border-box; }
        button.btn-primary {
            background: linear-gradient(135deg, #1f4037, #99f2c8); color: #0c0c0e; border: none;
            padding: 6px; font-weight: bold; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; font-size: 10px; margin-bottom: 3px;
        }
        button.btn-primary:hover { box-shadow: 0 0 8px var(--accent-green); }
        button.btn-civil { background: linear-gradient(135deg, #3a2318, #d39572); color: #110a05; }
        button.btn-animal { background: linear-gradient(135deg, #2c3e50, #3498db); color: #fff; }
        button.btn-advance { background: linear-gradient(135deg, #8e44ad, #f1c40f); color: #000; font-size: 12px; padding: 8px; }
        button.active-build { background: #ff4444 !important; color: #fff !important; }
        button.btn-sm {
            background: #1a1a24; color: var(--text-main); border: 1px solid var(--border-color);
            border-radius: 3px; cursor: pointer; padding: 4px 8px; font-size: 11px; font-weight: bold;
        }
        button.btn-sm:hover { background: var(--accent-green); color: #000; }
        .list-container { max-height: 90px; overflow-y: auto; border: 1px solid #1a1a24; padding: 4px; background: #0a0a0d; }
        #adviceBox {
            width: 100%; max-width: 1000px; margin-top: 10px; background: #16130a; border: 1px solid #4d3d00;
            color: #ffda6a; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div><button class="btn-sm" onclick="toggleMenu()">☰ Menú</button></div>
        <h1>WorldZeit // Expansión</h1>
        <div>
            <button class="btn-sm" onclick="zoomIn()">🔍 +</button>
            <button class="btn-sm" onclick="zoomOut()">🔍 -</button>
        </div>
    </header>

    <div class="dashboard" id="mainDashboard">
        <div class="era-item">👑 <span id="eraVal">Edad de Piedra</span></div>
        <div class="resource-item">Año: <span id="yearVal">1</span></div>
        <div class="resource-item">🪙 Oro: <span id="goldVal">300</span></div>
        <div class="resource-item">🌲 Madera: <span id="woodVal">300</span></div>
        <div class="resource-item">🍖 Comida: <span id="foodVal">300</span></div>
        <div class="resource-item">🪨 Piedra: <span id="stoneVal">300</span></div>
        <div class="resource-item">🦌 Pieles: <span id="skinVal">0</span></div>
    </div>

    <div class="game-area">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas" width="1600" height="1600" style="width: 800px; height: 800px;"></canvas>
        </div>
        <div class="sidebar" id="sidebarMenu">
            <div class="control-panel" id="dynamicControls"></div>
            <div class="control-panel">
                <strong>Estado del Imperio</strong>
                <div class="list-container" id="buildingsControl"></div>
                <div class="list-container" id="unitsControl" style="margin-top:5px;"></div>
            </div>
        </div>
    </div>

    <div id="adviceBox">
        <strong>Reporte:</strong> Su majestad ha establecido el campamento con un soldado y un aldeano en la Torre.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const MAP_SIZE = 40; const CELL_SIZE = 40; 
        let camera = { x: 0, y: 0, zoom: 1.0 };
        let isDragging = false, startX, startY;
        let selectedBuildingType = null;

        const ERAS = [
            { name: "Edad de Piedra", req: { g: 0, w: 0, f: 0, s: 0 } },
            { name: "Edad de Bronce", req: { g: 200, w: 200, f: 200, s: 200 } },
            { name: "Edad Medieval", req: { g: 500, w: 500, f: 500, s: 500 } },
            { name: "Renacimiento", req: { g: 1000, w: 800, f: 800, s: 1000 } },
            { name: "Edad Industrial", req: { g: 2000, w: 1500, f: 1500, s: 2000 } },
            { name: "Imperial Moderna", req: { g: 4000, w: 3000, f: 3000, s: 4000 } },
            { name: "Era Espacial", req: { g: 10000, w: 8000, f: 8000, s: 10000 } }
        ];

        const BLDG_DATA = {
            "Torre": { era: 0, w: 30, s: 50, hp: 400 },
            "Muralla": { era: 0, w: 10, s: 20, hp: 500 },
            "Puerta": { era: 0, w: 20, s: 30, hp: 450 },
            "Centro Urbano": { era: 1, w: 150, s: 150, hp: 800 },
            "Granja": { era: 1, w: 40, s: 10, hp: 200 },
            "Aserradero": { era: 1, w: 50, s: 20, hp: 250 },
            "Mina": { era: 1, w: 50, s: 50, hp: 300 },
            "Muelle": { era: 1, w: 60, s: 20, hp: 300 },
            "Maravilla": { era: 1, w: 1000, s: 1000, hp: 2000 },
            "Iglesia": { era: 2, w: 200, s: 300, hp: 600 },
            "Castillo": { era: 2, w: 400, s: 600, hp: 1500 },
            "Universidad": { era: 3, w: 300, s: 400, hp: 700 }
        };

        let state = getInitialState();

        function getInitialState() {
            let initialRoles = ['constructor', 'leñador', 'minero', 'agricultor', 'pescador', 'cazador'];
            let randomRole = initialRoles[Math.floor(Math.random() * initialRoles.length)];
            return {
                eraIndex: 0, year: 1, renewedThisYear: false,
                resources: { gold: 300, wood: 300, food: 300, stone: 300, skin: 0 },
                terrain: [], fog: [], nature: { resources: [] },
                buildings: [ { id: 1, type: "Torre", x: 20, y: 20, hp: 400, maxHp: 400, complete: true } ],
                units: [
                    { id: 'king', type: 'rey', x: 20, y: 21, hp: 500, inRefuge: false },
                    { id: 1, type: "civil", role: randomRole, x: 19, y: 20, hp: 100, kills: 0, pet: null },
                    { id: 2, type: "soldado", x: 21, y: 21, hp: 100 }
                ],
                domesticAnimals: [], pets: [], wildAnimals: [], barbarians: [], plagues: [],
                messages: "¡Bienvenido! El rey, un aldeano y un soldado están listos junto a la Torre."
            };
        }

        function initWorld() {
            state.terrain = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(0));
            state.fog = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(0)); 
            
            // Generador de Cuerpos de Agua Aleatorios (0: Río, 1: Lago, 2: Mar, 3: Combinado)
            let waterType = Math.floor(Math.random() * 4);
            
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    state.terrain[y][x] = 0; // Tierra base
                    
                    // Ríos
                    if ((waterType === 0 || waterType === 3) && x > 15 && x < 18) state.terrain[y][x] = 3;
                    // Lagos
                    if ((waterType === 1 || waterType === 3) && Math.hypot(x-10, y-10) < 6) state.terrain[y][x] = 3;
                    // Mar
                    if ((waterType === 2 || waterType === 3) && y > MAP_SIZE - 8) state.terrain[y][x] = 3;

                    // Bosques y Montañas aleatorias en tierra
                    if (state.terrain[y][x] === 0) {
                        if (Math.random() < 0.15) state.terrain[y][x] = 1; // Bosque
                        if (Math.random() < 0.1) state.terrain[y][x] = 8; // Montaña
                    }
                }
            }
            // Asegurar que la zona inicial sea de tierra
            for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++) state.terrain[20+dy][20+dx] = 0;
            
            respawnNature();
        }

        function respawnNature(isRenewal = false) {
            if(!isRenewal) { state.nature = { resources: [] }; state.wildAnimals = []; }
            
            // La abundancia baja con las eras
            let abundance = Math.max(0.1, 1 - (state.eraIndex * 0.15));

            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    let t = state.terrain[y][x];
                    
                    // Renovación controlada
                    if (Math.random() < abundance) {
                        if (t === 1 && Math.random() < 0.3) state.nature.resources.push({x, y, type: 'arbol', icon: '🌲'});
                        if (t === 8 && Math.random() < 0.2) state.nature.resources.push({x, y, type: 'piedra', icon: '🪨'});
                        if (t === 8 && Math.random() < 0.05) state.nature.resources.push({x, y, type: 'oro', icon: '🪙'});
                        
                        // Animales y vida marina
                        if (t === 3 && Math.random() < 0.1) {
                            let aquatic = ['🐟', '🦆', '🦀'];
                            state.wildAnimals.push({ x, y, icon: aquatic[Math.floor(Math.random()*aquatic.length)] });
                        }
                        if ((t === 0 || t === 1) && Math.random() < 0.02 && Math.abs(x-20)>5 && Math.abs(y-20)>5) {
                            state.wildAnimals.push({ x, y, icon: '🦌' });
                        }
                    }
                }
            }
        }

        window.toggleMenu = () => document.getElementById('sidebarMenu').classList.toggle('hidden');

        function renderDynamicUI() {
            let html = "";
            let nextEra = ERAS[state.eraIndex + 1];
            
            if (nextEra) {
                let canAdvance = state.resources.gold >= nextEra.req.g && state.resources.wood >= nextEra.req.w && state.resources.food >= nextEra.req.f && state.resources.stone >= nextEra.req.s;
                if(canAdvance) html += `<button class="btn-primary btn-advance" onclick="advanceEra()">🌟 [ALERTA] ¡Avanzar a ${nextEra.name}!</button>`;
            }

            html += `<strong>Construcción (Haz clic en mapa)</strong>`;
            Object.keys(BLDG_DATA).forEach(bName => {
                let b = BLDG_DATA[bName];
                if (state.eraIndex >= b.era) {
                    let activeClass = selectedBuildingType === bName ? 'active-build' : '';
                    html += `<button class="btn-primary ${activeClass}" onclick="selectBuilding('${bName}')">🏛️ ${bName} (${b.w}M, ${b.s}P)</button>`;
                }
            });

            // Militares adaptativos según la Era (Industrial es índice 4)
            let isIndustrial = state.eraIndex >= 4;
            let solName = isIndustrial ? 'Soldado 🔫' : 'Soldado ⚔️';
            let cavName = isIndustrial ? 'Vehículo 🚙' : 'Caballería 🏇🏼';

            html += `<strong>Fuerzas Armadas</strong>
                     <button class="btn-primary" onclick="recruit('soldado', 40, 20)">🪖 ${solName} (40O, 20C)</button>`;
            if(state.eraIndex >= 1) html += `<button class="btn-primary" onclick="recruit('caballeria', 80, 50)">🐴 ${cavName} (80O, 50C)</button>`;

            html += `<strong>Aldeanos & Roles</strong>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('constructor', 50)">🔨 Constructor</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('agricultor', 50)">👩🏼‍🌾 Agricultor</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('leñador', 50)">🪓 Leñador</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('minero', 50)">⚒️ Minero</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('pescador', 50)">🎣 Pescador</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('cazador', 50)">🏹 Cazador</button>`;
                     
            html += `<strong>Control de Plagas</strong>
                     <button class="btn-primary btn-animal" onclick="buyCat()">🐈 Comprar Gato (20O)</button>`;
            
            document.getElementById('dynamicControls').innerHTML = html;
        }

        window.selectBuilding = function(type) { selectedBuildingType = selectedBuildingType === type ? null : type; renderDynamicUI(); }

        window.advanceEra = function() {
            let req = ERAS[state.eraIndex + 1].req;
            state.resources.gold -= req.g; state.resources.wood -= req.w; state.resources.food -= req.f; state.resources.stone -= req.s;
            state.eraIndex++;
            state.messages = `🌟 ¡Has avanzado a la ${ERAS[state.eraIndex].name}!`;
            document.getElementById('eraVal').innerText = ERAS[state.eraIndex].name;
            renderDynamicUI(); updateUI();
        }

        window.recruit = function(type, goldCost, foodCost) {
            if (state.resources.gold >= goldCost && state.resources.food >= foodCost) {
                state.resources.gold -= goldCost; state.resources.food -= foodCost;
                let king = state.units.find(u => u.type === 'rey');
                state.units.push({ id: Date.now(), type: type, x: king.x+1, y: king.y, hp: type==='caballeria'?200:100 });
                updateUI();
            }
        }

        window.recruitCivilian = function(role, foodCost) {
            if (state.resources.food >= foodCost) {
                state.resources.food -= foodCost;
                let king = state.units.find(u => u.type === 'rey');
                state.units.push({ id: Date.now(), type: 'civil', role: role, x: king.x-1, y: king.y, hp: 60, kills: 0, pet: null });
                updateUI();
            }
        }

        window.buyCat = function() {
            if(state.resources.gold >= 20) {
                state.resources.gold -= 20;
                let king = state.units.find(u => u.type === 'rey');
                state.pets.push({ x: king.x, y: king.y, icon: '🐈' });
                state.messages = "🐈 Gato adquirido. Ayudará a controlar plagas.";
            }
        }

        canvas.addEventListener("click", e => {
            if (!selectedBuildingType) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX; const clickY = (e.clientY - rect.top) * scaleY;
            const mapX = Math.floor((clickX / camera.zoom - camera.x) / CELL_SIZE);
            const mapY = Math.floor((clickY / camera.zoom - camera.y) / CELL_SIZE);

            if (mapX >= 0 && mapX < MAP_SIZE && mapY >= 0 && mapY < MAP_SIZE) {
                let data = BLDG_DATA[selectedBuildingType];
                if (state.resources.wood >= data.w && state.resources.stone >= data.s) {
                    state.resources.wood -= data.w; state.resources.stone -= data.s;
                    state.buildings.push({ id: Date.now(), type: selectedBuildingType, x: mapX, y: mapY, hp: data.hp, maxHp: data.hp, complete: false });
                    selectedBuildingType = null; renderDynamicUI(); updateUI();
                }
            }
        });

        function gameLogicTick() {
            let rey = state.units.find(u => u.type === 'rey');
            if(!rey) return; // Fin del juego manejado externamente
            
            let mod = 1 + (state.eraIndex * 0.2);

            // Renovación de recursos cada 10 años
            if (state.year % 10 === 0 && !state.renewedThisYear) {
                respawnNature(true); state.renewedThisYear = true;
                state.messages = "♻️ La naturaleza se ha renovado (Ciclo 10 años).";
            } else if (state.year % 10 !== 0) { state.renewedThisYear = false; }

            // Mecánica de Plagas
            if(Math.random() < 0.05) {
                let plagasArr = ['🐀', '🦗', '🪰', '🪱'];
                state.plagues.push({x: Math.floor(Math.random()*MAP_SIZE), y: Math.floor(Math.random()*MAP_SIZE), icon: plagasArr[Math.floor(Math.random()*4)]});
            }
            state.plagues.forEach((p, idx) => {
                state.resources.food = Math.max(0, state.resources.food - 0.5); // Daño a recursos
                state.units.forEach(u => { if(u.type === 'civil' && Math.abs(u.x - p.x) <= 2) u.hp -= 1; }); // Daño a salud
                
                // Los gatos cazan plagas
                state.pets.forEach(cat => {
                    if (cat.icon === '🐈') {
                        if(cat.x < p.x) cat.x++; else if(cat.x > p.x) cat.x--;
                        if(cat.y < p.y) cat.y++; else if(cat.y > p.y) cat.y--;
                        if(Math.abs(cat.x - p.x) <= 1 && Math.abs(cat.y - p.y) <= 1) state.plagues.splice(idx, 1);
                    }
                });
            });

            // Lógica de Construcción
            let activeConstructors = state.units.filter(u => u.type === 'civil' && u.role === 'constructor').length;
            state.buildings.forEach(b => {
                if(!b.complete && activeConstructors > 0) {
                    b.hp += 15 * (activeConstructors * 1.5);
                    if(b.hp >= b.maxHp) { b.hp = b.maxHp; b.complete = true; }
                } else if(b.complete) {
                    if(b.type === 'Granja') state.resources.food += 1 * mod;
                    if(b.type === 'Mina') { state.resources.stone += 0.8 * mod; state.resources.gold += 0.3 * mod; }
                    if(b.type === 'Aserradero') state.resources.wood += 1 * mod;
                }
            });

            // Refugio del Rey (Torre o Castillo)
            let refugio = state.buildings.find(b => (b.type === 'Castillo' || b.type === 'Torre') && b.complete && Math.abs(rey.x - b.x) <= 2 && Math.abs(rey.y - b.y) <= 2);
            if (refugio) { rey.inRefuge = true; rey.hp = Math.min(500, rey.hp + 20); } 
            else { rey.inRefuge = false; }

            // Lógica Unidades
            state.units.forEach(u => {
                if(u.type === 'civil') {
                    if(u.role === 'leñador') state.resources.wood += 0.5 * mod;
                    if(u.role === 'minero') { state.resources.stone += 0.4 * mod; state.resources.gold += 0.2 * mod; }
                    if(u.role === 'agricultor') state.resources.food += 0.6 * mod;
                    if(u.role === 'pescador') state.resources.food += 0.8 * mod; // Pesca da más comida

                    // Cazador
                    if(u.role === 'cazador') {
                        let presa = state.wildAnimals[0];
                        if(presa) {
                            if(u.x < presa.x) u.x++; else if(u.x > presa.x) u.x--;
                            if(u.y < presa.y) u.y++; else if(u.y > presa.y) u.y--;
                            if(Math.abs(u.x - presa.x) <= 1) {
                                state.wildAnimals.shift();
                                state.resources.food += 20 * mod;
                                if(presa.icon === '🦌') state.resources.skin += 5;
                                u.kills++;
                                if(u.kills > 5 && !u.pet) { u.pet = '🐕‍🦺'; state.messages = "🏹 Un cazador experto ha domado un perro."; }
                            }
                        }
                    } else if(Math.random() < 0.2) { u.x += Math.floor(Math.random()*3)-1; u.y += Math.floor(Math.random()*3)-1; }
                }
                
                if (u.type === 'soldado' || u.type === 'caballeria') {
                    let spd = (u.type === 'caballeria' && state.eraIndex < 4) ? 2 : (state.eraIndex >= 4 ? 3 : 1); // Vehículos más rápidos
                    let target = state.barbarians[0];
                    if (target) {
                        if(target.x > u.x) u.x+=spd; else if(target.x < u.x) u.x-=spd;
                        if(target.y > u.y) u.y+=spd; else if(target.y < u.y) u.y-=spd;
                        
                        let range = state.eraIndex >= 4 ? 3 : 1; // Armas de fuego tienen rango
                        if(Math.abs(target.x - u.x) <= range) target.hp -= (u.type==='caballeria'?50:30);
                    }
                }
                
                if(u.type === 'rey' && !u.inRefuge && Math.random() < 0.1) {
                    u.x += Math.floor(Math.random()*3)-1; u.y += Math.floor(Math.random()*3)-1;
                }
                
                u.x = Math.max(0, Math.min(MAP_SIZE - 1, u.x)); u.y = Math.max(0, Math.min(MAP_SIZE - 1, u.y));
            });

            // Bárbaros y Limpieza
            if (state.barbarians.length < (2 + state.eraIndex) && Math.random() < 0.15) {
                state.barbarians.push({ x: Math.random()>0.5?0:MAP_SIZE-1, y: Math.random()>0.5?0:MAP_SIZE-1, hp: 120 + (state.eraIndex*40) });
            }
            state.barbarians.forEach(b => {
                if(b.x < rey.x) b.x++; else if(b.x > rey.x) b.x--;
                if(b.y < rey.y) b.y++; else if(b.y > rey.y) b.y--;
                if(Math.abs(rey.x - b.x) <= 1 && !rey.inRefuge) rey.hp -= 30;
            });

            state.barbarians = state.barbarians.filter(b => b.hp > 0);
            state.buildings = state.buildings.filter(b => b.hp > 0);
            state.units = state.units.filter(u => u.hp > 0);

            updateVision(); updateUI();
        }

        function updateVision() {
            for(let y=0; y<MAP_SIZE; y++) for(let x=0; x<MAP_SIZE; x++) if(state.fog[y][x] === 2) state.fog[y][x] = 1;
            state.units.forEach(u => {
                let range = 4;
                for(let dy = -range; dy <= range; dy++) {
                    for(let dx = -range; dx <= range; dx++) {
                        let ny = u.y + dy, nx = u.x + dx;
                        if(ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE) state.fog[ny][nx] = 2;
                    }
                }
            });
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
            ctx.translate(camera.x, camera.y); ctx.scale(camera.zoom, camera.zoom);

            const colors = { 0: "#253b25", 1: "#152d15", 2: "#b5a375", 3: "#1a5276", 7: "#123048", 8: "#6c7a89" };
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    ctx.fillStyle = colors[state.terrain[y][x]] || "#000"; ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.strokeRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }

            state.nature.resources.forEach(res => { ctx.font="15px Arial"; ctx.fillText(res.icon, (res.x+0.5)*CELL_SIZE, (res.y+0.5)*CELL_SIZE); });
            
            state.buildings.forEach(b => {
                let bx = b.x * CELL_SIZE, by = b.y * CELL_SIZE;
                ctx.fillStyle = b.complete ? (b.type==='Castillo'?'#6c5ce7':(b.type==='Torre'?'#7f8c8d':'#27ae60')) : '#555';
                let size = (b.type === 'Castillo' || b.type === 'Torre') ? CELL_SIZE * 1.5 : CELL_SIZE; 
                ctx.fillRect(bx + 2, by + 2, size - 4, size - 4);
                ctx.fillStyle = "red"; ctx.fillRect(bx + 4, by - 6, size - 8, 4);
                ctx.fillStyle = "#0f0"; ctx.fillRect(bx + 4, by - 6, (size - 8) * (b.hp / b.maxHp), 4);
            });

            ctx.font = "20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            state.wildAnimals.forEach(w => ctx.fillText(w.icon, (w.x+0.5)*CELL_SIZE, (w.y+0.5)*CELL_SIZE));
            state.pets.forEach(p => ctx.fillText(p.icon, (p.x+0.5)*CELL_SIZE, (p.y+0.5)*CELL_SIZE));
            state.plagues.forEach(p => ctx.fillText(p.icon, (p.x+0.5)*CELL_SIZE, (p.y+0.5)*CELL_SIZE));
            state.barbarians.forEach(b => ctx.fillText('👹', (b.x+0.5)*CELL_SIZE, (b.y+0.5)*CELL_SIZE));

            state.units.forEach(u => {
                if(u.type === 'rey') {
                    if (!u.inRefuge) {
                        ctx.fillText('👑', (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                        ctx.fillStyle = "red"; ctx.fillRect(u.x*CELL_SIZE+4, u.y*CELL_SIZE-6, CELL_SIZE-8, 4);
                        ctx.fillStyle = "#0f0"; ctx.fillRect(u.x*CELL_SIZE+4, u.y*CELL_SIZE-6, (CELL_SIZE-8)*(u.hp/500), 4);
                    }
                } else if(u.type === 'soldado') {
                    ctx.fillText(state.eraIndex >= 4 ? '🔫' : '⚔️', (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                } else if(u.type === 'caballeria') {
                    ctx.fillText(state.eraIndex >= 4 ? '🚙' : '🏇🏼', (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                } else {
                    let roleIcon = u.role === 'cazador' ? '🏹' : (u.role === 'pescador' ? '🎣' : (u.role === 'agricultor' ? '👩🏼‍🌾' : '👷'));
                    ctx.fillText(roleIcon, (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                    if(u.pet) ctx.fillText(u.pet, (u.x+0.8)*CELL_SIZE, (u.y+0.8)*CELL_SIZE);
                }
            });

            for(let y=0; y<MAP_SIZE; y++) {
                for(let x=0; x<MAP_SIZE; x++) {
                    if(state.fog[y][x] === 0) { ctx.fillStyle = "rgba(5, 5, 8, 0.9)"; ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE); }
                    else if(state.fog[y][x] === 1) { ctx.fillStyle = "rgba(5, 5, 8, 0.5)"; ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE); }
                }
            }

            ctx.restore(); requestAnimationFrame(renderLoop);
        }

        function updateUI() {
            document.getElementById("goldVal").innerText = Math.floor(state.resources.gold);
            document.getElementById("woodVal").innerText = Math.floor(state.resources.wood);
            document.getElementById("foodVal").innerText = Math.floor(state.resources.food);
            document.getElementById("stoneVal").innerText = Math.floor(state.resources.stone);
            document.getElementById("skinVal").innerText = Math.floor(state.resources.skin);
            document.getElementById("adviceBox").innerHTML = `<strong>Reporte:</strong> ${state.messages}`;

            let bHtml = ""; state.buildings.forEach(b => bHtml += `<div>🏛️ ${b.type} (${b.complete?'Activo':'Construyendo...'} - ${Math.floor(b.hp)} HP)</div>`);
            document.getElementById("buildingsControl").innerHTML = bHtml;

            let uHtml = "";
            let rey = state.units.find(u=>u.type==='rey'); 
            if(rey) uHtml += `<div style="color:gold">👑 Rey ${rey.inRefuge?'(Refugiado 🛡️)':''} (${rey.hp} HP)</div>`;
            state.units.filter(u=>u.type!=='rey').forEach(u => uHtml += `<div>• ${u.type==='civil'?`Aldeano (${u.role})`:u.type}</div>`);
            document.getElementById("unitsControl").innerHTML = uHtml;
            renderDynamicUI();
        }

        window.zoomIn = () => camera.zoom = Math.min(camera.zoom + 0.2, 2.5);
        window.zoomOut = () => camera.zoom = Math.max(camera.zoom - 0.2, 0.5);

        const container = document.getElementById("canvasContainer");
        container.addEventListener("mousedown", e => { isDragging = true; startX = e.clientX - camera.x; startY = e.clientY - camera.y; container.style.cursor = "grabbing"; });
        window.addEventListener("mousemove", e => { if(isDragging) { camera.x = e.clientX - startX; camera.y = e.clientY - startY; } });
        window.addEventListener("mouseup", () => { isDragging = false; container.style.cursor = "crosshair"; });

        initWorld(); renderDynamicUI(); updateVision(); updateUI();
        setInterval(() => { state.year++; document.getElementById("yearVal").innerText = state.year; }, 10000); // 1 Año cada 10 segundos
        setInterval(gameLogicTick, 1000);
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
