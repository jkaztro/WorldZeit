<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>WorldZeit - Evolución Táctica</title>
    <style>
        body { margin: 0; background: #0f1115; color: #fff; overflow: hidden; font-family: sans-serif; }
        #gameCanvas { display: block; cursor: crosshair; }
        #hud { position: absolute; top: 10px; left: 10px; pointer-events: none; text-shadow: 1px 1px 2px #000; }
    </style>
</head>
<body>
    <div id="hud">
        <div id="stats">PE: 0 | Población: 0</div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Configuración del Motor
    let projectiles = [];
    let gameData = { pe: 0, pop: 0 };
    
    // Clase de Proyectil para el combate
    class Projectile {
        constructor(x, y, targetX, targetY) {
            this.x = x;
            this.y = y;
            this.tx = targetX;
            this.ty = targetY;
            this.speed = 5;
        }
        update() {
            let dx = this.tx - this.x;
            let dy = this.ty - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            this.x += (dx/dist) * this.speed;
            this.y += (dy/dist) * this.speed;
            return dist < 5; // Retorna true si impactó
        }
        draw() {
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 3, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // Mejora del bucle de juego para incluir proyectiles
    function updateGame() {
        // Lógica de proyectiles
        for(let i = projectiles.length - 1; i >= 0; i--) {
            if(projectiles[i].update()) {
                projectiles.splice(i, 1);
                // Aquí podrías añadir lógica de daño
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Dibujado optimizado de los proyectiles
        projectiles.forEach(p => p.draw());
        
        requestAnimationFrame(render);
    }

    // Ejemplo de disparo: Llamar esto cuando una torre detecte enemigo
    function fireArrow(startX, startY, endX, endY) {
        projectiles.push(new Projectile(startX * 32, startY * 32, endX * 32, endY * 32));
    }

    // Inicialización
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
    window.dispatchEvent(new Event('resize'));
    
    render();
</script>
</body>
</html>
