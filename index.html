<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorldZeit - Evolución</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #00ff88;
            --danger-color: #ff3333;
            --panel-bg: #1e1e1e;
            --btn-bg: #2a2a2a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        h1 {
            color: var(--accent-color);
            font-size: 22px;
            margin: 8px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #game-container {
            background-color: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 340px;
        }

        canvas {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 4px;
            display: block;
            image-rendering: pixelated; 
        }

        #ui-panel {
            margin-top: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            line-height: 1.4;
            width: 100%;
        }

        .stat-highlight {
            color: var(--accent-color);
        }

        .danger-highlight {
            color: var(--danger-color);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        #tech-panel {
            margin-top: 8px;
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .tech-btn {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tech-btn.unlocked {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>WORLDZEIT</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        <div id="ui-panel">
            Era: <span class="stat-highlight" id="lbl-age">Piedra</span> | PE: <span id="lbl-pe">0</span><br>
            🪵 Madera: <span id="lbl-wood">0</span> | 🪨 Piedra: <span id="lbl-stone">0</span> | 🪙 Oro: <span id="lbl-gold">0</span><br>
            Estado: <span class="stat-highlight" id="lbl-status">Paz en el territorio</span>
        </div>
        <div id="tech-panel">
            <button class="tech-btn" id="btn-fire" onclick="researchTech('fire')">🔥 Fuego (20M)</button>
            <button class="tech-btn" id="btn-flint" onclick="researchTech('flint')">🪨 Sílex (30P)</button>
            <button class="tech-btn" id="btn-agri" onclick="researchTech('agri')">🌾 Agríc. (40M,20P)</button>
            <button class="tech-btn" id="btn-bronze" onclick="researchTech('bronze')">🛡️ Metal. (50P,10O)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 16; 
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        const TERRAIN_COLORS = {
            0: '#1e3f5a', // Agua 
            1: '#c2b280', // Arena/Playa
            2: '#2d5a27', // Pasto/Llanura
            3: '#1b3b18', // Bosque denso
            4: '#5c5c5c'  // Montaña
        };

        let map = [];
        let resources = {}; 
        let avatars = [];
        let barbarians = [];

        let inventory = {
            wood: 0,
            stone: 0,
            gold: 0,
            pe: 0
        };

        let technologies = {
            fire: false,
            flint: false,
            agri: false,
            bronze: false
        };

        let gameTicks = 0;
        let invasionActive = false;

        function generateMap() {
            map = [];
            resources = {};

            for (let y = 0; y < ROWS; y++) {
                let row = [];
                for (let x = 0; x < COLS; x++) {
                    let rand = Math.random();
                    let tile = rand < 0.45 ? 0 : (rand < 0.75 ? 2 : (rand < 0.90 ? 3 : 4));
                    row.push(tile);

                    if (tile === 3 && Math.random() < 0.4) {
                        resources[`${x},${y}`] = 'wood';
                    } else if (tile === 4 && Math.random() < 0.5) {
                        resources[`${x},${y}`] = 'stone';
                    } else if (tile === 2 && Math.random() < 0.05) {
                        resources[`${x},${y}`] = 'gold';
                    }
                }
                map.push(row);
            }

            for(let p = 0; p < 3; p++) {
                let newMap = [];
                for (let y = 0; y < ROWS; y++) {
                    let newRow = [];
                    for (let x = 0; x < COLS; x++) {
                        newRow.push(getMostCommonNeighbor(x, y));
                    }
                    newMap.push(newRow);
                }
                map = newMap;
            }

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (map[y][x] === 2 && hasNeighbor(x, y, 0)) {
                        map[y][x] = 1;
                    }
                }
            }
        }

        function getMostCommonNeighbor(x, y) {
            let counts = {0:0, 1:0, 2:0, 3:0, 4:0};
            for(let dy = -1; dy <= 1; dy++) {
                for(let dx = -1; dx <= 1; dx++) {
                    let nx = x + dx;
                    let ny = y + dy;
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        counts[map[ny][nx]]++;
                    }
                }
            }
            let maxCount = -1;
            let bestTile = map[y][x];
            for(let tile in counts) {
                if(counts[tile] > maxCount) {
                    maxCount = counts[tile];
                    bestTile = parseInt(tile);
                }
            }
            return bestTile;
        }

        function hasNeighbor(x, y, targetTile) {
            for(let dy = -1; dy <= 1; dy++) {
                for(let dx = -1; dx <= 1; dx++) {
                    let nx = x + dx;
                    let ny = y + dy;
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        if(map[ny][nx] === targetTile && (dx !== 0 || dy !== 0)) return true;
                    }
                }
            }
            return false;
        }

        function spawnAvatars() {
            avatars = [];
            let spawned = 0;
            while(spawned < 2) {
                let rx = Math.floor(Math.random() * COLS);
                let ry = Math.floor(Math.random() * ROWS);
                if (map[ry][rx] === 2) {
                    avatars.push({
                        x: rx,
                        y: ry,
                        color: spawned === 0 ? '#ff007f' : '#00bfff',
                        moveTimer: 0
                    });
                    spawned++;
                }
            }
        }

        function triggerInvasion() {
            invasionActive = true;
            barbarians = [];
            let count = 2 + Math.floor(Math.random() * 2);
            for(let i = 0; i < count; i++) {
                let bx = Math.random() < 0.5 ? 0 : COLS - 1;
                let by = Math.floor(Math.random() * ROWS);
                barbarians.push({
                    x: bx,
                    y: by,
                    moveTimer: 0
                });
            }
        }

        function drawMap() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    ctx.fillStyle = TERRAIN_COLORS[map[y][x]];
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

                    let key = `${x},${y}`;
                    if (resources[key]) {
                        if (resources[key] === 'wood') {
                            ctx.fillStyle = '#8b5a2b';
                            ctx.fillRect(x * TILE_SIZE + 5, y * TILE_SIZE + 5, 6, 6);
                        } else if (resources[key] === 'stone') {
                            ctx.fillStyle = '#aaaaaa';
                            ctx.fillRect(x * TILE_SIZE + 4, y * TILE_SIZE + 4, 8, 8);
                        } else if (resources[key] === 'gold') {
                            ctx.fillStyle = '#ffd700';
                            ctx.fillRect(x * TILE_SIZE + 6, y * TILE_SIZE + 6, 4, 4);
                        }
                    }
                }
            }
        }

        function drawEntities() {
            for (let i = 0; i < avatars.length; i++) {
                let av = avatars[i];
                ctx.fillStyle = av.color;
                ctx.fillRect(av.x * TILE_SIZE + 3, av.y * TILE_SIZE + 3, TILE_SIZE - 6, TILE_SIZE - 6);
            }
            for (let i = 0; i < barbarians.length; i++) {
                let barb = barbarians[i];
                ctx.fillStyle = '#ff4500';
                ctx.fillRect(barb.x * TILE_SIZE + 3, barb.y * TILE_SIZE + 3, TILE_SIZE - 6, TILE_SIZE - 6);
            }
        }

        function researchTech(tech) {
            if (tech === 'fire' && !technologies.fire) {
                if (inventory.wood >= 20) {
                    inventory.wood -= 20;
                    technologies.fire = true;
                    inventory.pe += 25;
                    document.getElementById('btn-fire').classList.add('unlocked');
                    document.getElementById('btn-fire').innerText = "🔥 Fuego (✓)";
                }
            } else if (tech === 'flint' && !technologies.flint) {
                if (inventory.stone >= 30) {
                    inventory.stone -= 30;
                    technologies.flint = true;
                    inventory.pe += 40;
                    document.getElementById('btn-flint').classList.add('unlocked');
                    document.getElementById('btn-flint').innerText = "🪨 Sílex (✓)";
                }
            } else if (tech === 'agri' && !technologies.agri) {
                if (inventory.wood >= 40 && inventory.stone >= 20) {
                    inventory.wood -= 40;
                    inventory.stone -= 20;
                    technologies.agri = true;
                    inventory.pe += 75;
                    document.getElementById('btn-agri').classList.add('unlocked');
                    document.getElementById('btn-agri').innerText = "🌾 Agríc. (✓)";
                }
            } else if (tech === 'bronze' && !technologies.bronze) {
                if (inventory.stone >= 50 && inventory.gold >= 10) {
                    inventory.stone -= 50;
                    inventory.gold -= 10;
                    technologies.bronze = true;
                    inventory.pe += 150;
                    document.getElementById('btn-bronze').classList.add('unlocked');
                    document.getElementById('btn-bronze').innerText = "🛡️ Metal. (✓)";
                }
            }
        }

        function updateGame() {
            gameTicks++;
            if (!invasionActive && gameTicks % 400 === 0 && inventory.pe > 30) {
                if (Math.random() < 0.7) {
                    triggerInvasion();
                }
            }

            for (let i = 0; i < avatars.length; i++) {
                let av = avatars[i];
                av.moveTimer++;
                if (av.moveTimer > 40) {
                    let dx = Math.floor(Math.random() * 3) - 1; 
                    let dy = Math.floor(Math.random() * 3) - 1;
                    let nx = av.x + dx;
                    let ny = av.y + dy;
                    
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 0) {
                        av.x = nx;
                        av.y = ny;

                        let key = `${nx},${ny}`;
                        if (resources[key]) {
                            let resType = resources[key];
                            let multiplier = technologies.bronze ? 3 : (technologies.flint ? 2 : 1);

                            if (resType === 'wood') { inventory.wood += (5 * multiplier); inventory.pe += 2; }
                            if (resType === 'stone') { inventory.stone += (3 * multiplier); inventory.pe += 3; }
                            if (resType === 'gold') { inventory.gold += (1 * multiplier); inventory.pe += 10; }
                            delete resources[key];
                        }
                    }
                    av.moveTimer = 0;
                }
            }

            if (invasionActive) {
                for (let i = barbarians.length - 1; i >= 0; i--) {
                    let barb = barbarians[i];
                    barb.moveTimer++;
                    if (barb.moveTimer > 35) {
                        let targetX = Math.floor(COLS / 2);
                        let targetY = Math.floor(ROWS / 2);
                        
                        if (barb.x < targetX) barb.x++;
                        else if (barb.x > targetX) barb.x--;
                        if (barb.y < targetY) barb.y++;
                        else if (barb.y > targetY) barb.y--;

                        barb.moveTimer = 0;
                    }

                    for (let j = avatars.length - 1; j >= 0; j--) {
                        let av = avatars[j];
                        if (barb.x === av.x && barb.y === av.y) {
                            if (technologies.flint || technologies.bronze) {
                                inventory.pe += 20;
                                barbarians.splice(i, 1);
                            } else {
                                if (inventory.gold > 0) inventory.gold--;
                                else if (inventory.wood > 5) inventory.wood -= 5;
                            }
                            break;
                        }
                    }
                }

                if (barbarians.length === 0) {
                    invasionActive = false;
                }
            }

            updateUI();
        }

        function updateUI() {
            document.getElementById('lbl-wood').innerText = inventory.wood;
            document.getElementById('lbl-stone').innerText = inventory.stone;
            document.getElementById('lbl-gold').innerText = inventory.gold;
            document.getElementById('lbl-pe').innerText = inventory.pe;

            let ageLabel = "Piedra";
            if (inventory.pe >= 200 || technologies.bronze) ageLabel = "Edad de Bronce";
            if (inventory.pe >= 600) ageLabel = "Edad Media";
            document.getElementById('lbl-age').innerText = ageLabel;

            let statusElem = document.getElementById('lbl-status');
            if (invasionActive) {
                statusElem.innerText = "¡INVASIÓN BÁRBARA!";
                statusElem.className = "danger-highlight";
            } else {
                statusElem.innerText = "Paz en el territorio";
                statusElem.className = "stat-highlight";
            }
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateGame();
            drawMap();
            drawEntities();
            requestAnimationFrame(gameLoop);
        }

        generateMap();
        spawnAvatars();
        gameLoop();
    </script>
</body>
</html>
