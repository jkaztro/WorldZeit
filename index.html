<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldZeit - Estrategia en la Nube</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #444;
            background: #222;
        }
        #ui {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="ui">Oro: <span id="goldVal">100</span> | Madera: <span id="woodVal">100</span></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const ROWS = 20;
        const COLS = 20;
        const CELL_SIZE = canvas.width / COLS;

        // Estado del juego
        let fogMap = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        let resources = { gold: 100, wood: 100, woodRate: 1.0 };
        
        // Unidades de ejemplo (Explorador)
        let units = [
            { x: 10, y: 10, visionRange: 3 }
        ];

        // Lógica de Niebla de Guerra
        function updateVision() {
            for(let y = 0; y < ROWS; y++) {
                for(let x = 0; x < COLS; x++) {
                    if(fogMap[y][x] === 2) fogMap[y][x] = 1;
                }
            }
            
            units.forEach(u => {
                let range = u.visionRange;
                for(let dy = -range; dy <= range; dy++) {
                    for(let dx = -range; dx <= range; dx++) {
                        let ny = u.y + dy;
                        let nx = u.x + dx;
                        if(ny >= 0 && ny < ROWS && nx >= 0 && nx < COLS) {
                            fogMap[ny][nx] = 2;
                        }
                    }
                }
            });
        }

        // Sistema Económico
        function updateEconomy() {
            let maintenanceCost = units.length * 0.05;
            resources.gold = Math.max(0, resources.gold - maintenanceCost);
            
            if(resources.woodRate > 0.2) {
                resources.woodRate *= 0.99;
            }

            // Actualizar interfaz HTML
            document.getElementById("goldVal").innerText = resources.gold.toFixed(1);
            document.getElementById("woodVal").innerText = resources.wood.toFixed(1);
        }

        // Bucle de Renderizado
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dibujar terreno base simulado
            ctx.fillStyle = "#3a3a3a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar Unidades
            units.forEach(u => {
                ctx.fillStyle = "#00ffcc";
                ctx.fillRect(u.x * CELL_SIZE, u.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            });

            // Dibujar Niebla de Guerra
            for(let y = 0; y < ROWS; y++) {
                for(let x = 0; x < COLS; x++) {
                    if(fogMap[y][x] === 0) {
                        ctx.fillStyle = "black";
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    } else if(fogMap[y][x] === 1) {
                        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }
        }

        // Movimiento simple de prueba para la unidad con las flechas
        window.addEventListener("keydown", (e) => {
            if(e.key === "ArrowUp" && units[0].y > 0) units[0].y--;
            if(e.key === "ArrowDown" && units[0].y < ROWS - 1) units[0].y++;
            if(e.key === "ArrowLeft" && units[0].x > 0) units[0].x--;
            if(e.key === "ArrowRight" && units[0].x < COLS - 1) units[0].x++;
        });

        // Ciclos principales del juego
        setInterval(() => {
            updateVision();
            updateEconomy();
            render();
        }, 100);
    </script>
</body>
</html>
