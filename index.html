<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldZeit - Advanced Core // Ecosistema y Refugio en Torre</title>
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: #111115;
            --border-color: #22222d;
            --accent-green: #00ffcc;
            --accent-gold: #ffd700;
            --accent-warn: #ff4444;
            --accent-era: #b8c2cc;
            --text-main: #d0d0d6;
        }

        body {
            margin: 0; background: var(--bg-dark); color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            padding: 10px; box-sizing: border-box; height: 100vh; overflow: hidden;
        }

        header {
            text-align: center; margin-bottom: 5px; display: flex;
            justify-content: space-between; width: 100%; max-width: 1000px; align-items: center;
        }

        h1 { margin: 0; font-size: 15px; color: var(--accent-green); letter-spacing: 2px; text-transform: uppercase; }

        .dashboard {
            display: flex; gap: 12px; background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold;
            margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); justify-content: center;
            width: 100%; max-width: 1000px; flex-wrap: wrap;
        }

        .resource-item span { color: var(--accent-gold); }
        .era-item { color: var(--accent-era); font-size: 13px; }

        .game-area {
            display: flex; gap: 10px; width: 100%; max-width: 1000px; flex-grow: 1; max-height: 580px;
        }

        .canvas-container {
            position: relative; overflow: hidden; border: 2px solid var(--border-color);
            background: #0d0d11; border-radius: 6px; box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            flex-grow: 1; display: flex; justify-content: center; align-items: center; cursor: crosshair;
        }

        canvas { display: block; transform-origin: 0 0; }

        .sidebar { width: 290px; display: flex; flex-direction: column; gap: 8px; transition: all 0.3s ease; }
        .sidebar.hidden { display: none; }

        .control-panel {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px;
            padding: 6px; font-size: 10px; display: flex; flex-direction: column; gap: 4px;
            flex-grow: 1; overflow-y: auto; max-height: 390px;
        }

        .control-panel strong {
            color: var(--accent-green); border-bottom: 1px solid var(--border-color);
            padding-bottom: 3px; margin-bottom: 3px; text-align: center; display: block; margin-top: 4px;
        }

        button { width: 100%; box-sizing: border-box; }
        button.btn-primary {
            background: linear-gradient(135deg, #1f4037, #99f2c8); color: #0c0c0e; border: none;
            padding: 5px; font-weight: bold; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; font-size: 9px; margin-bottom: 2px;
        }
        button.btn-primary:hover { box-shadow: 0 0 8px var(--accent-green); }
        button.btn-civil { background: linear-gradient(135deg, #3a2318, #d39572); color: #110a05; }
        button.btn-animal { background: linear-gradient(135deg, #2c3e50, #3498db); color: #fff; }
        button.btn-advance { background: linear-gradient(135deg, #8e44ad, #f1c40f); color: #000; font-size: 11px; padding: 6px; }
        button.active-build { background: #ff4444 !important; color: #fff !important; }

        button.btn-sm {
            background: #1a1a24; color: var(--text-main); border: 1px solid var(--border-color);
            border-radius: 3px; cursor: pointer; padding: 3px 6px; font-size: 10px; font-weight: bold;
        }
        button.btn-sm:hover { background: var(--accent-green); color: #000; }
        
        .list-container { max-height: 80px; overflow-y: auto; border: 1px solid #1a1a24; padding: 3px; background: #0a0a0d; }

        #adviceBox {
            width: 100%; max-width: 1000px; margin-top: 8px; background: #16130a; border: 1px solid #4d3d00;
            color: #ffda6a; padding: 6px; border-radius: 6px; font-size: 10px; text-align: center; font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div><button class="btn-sm" onclick="toggleMenu()">☰ Menú</button></div>
        <h1>WorldZeit // Advanced Core</h1>
        <div>
            <button class="btn-sm" onclick="zoomIn()">🔍 +</button>
            <button class="btn-sm" onclick="zoomOut()">🔍 -</button>
        </div>
    </header>

    <div class="dashboard" id="mainDashboard">
        <div class="era-item">👑 <span id="eraVal">Edad de Piedra</span></div>
        <div class="resource-item">Año: <span id="yearVal">1</span></div>
        <div class="resource-item">🪙 Oro: <span id="goldVal">300</span></div>
        <div class="resource-item">🌲 Madera: <span id="woodVal">300</span></div>
        <div class="resource-item">🐟 Comida: <span id="foodVal">300</span></div>
        <div class="resource-item">🪨 Piedra: <span id="stoneVal">300</span></div>
    </div>

    <div class="game-area">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas" width="1600" height="1600" style="width: 800px; height: 800px;"></canvas>
        </div>

        <div class="sidebar" id="sidebarMenu">
            <div class="control-panel" id="dynamicControls"></div>
            <div class="control-panel">
                <strong>Estado del Imperio</strong>
                <div class="list-container" id="buildingsControl"></div>
                <div class="list-container" id="unitsControl" style="margin-top:4px;"></div>
            </div>
        </div>
    </div>

    <div id="adviceBox">
        <strong>Reporte:</strong> El asentamiento ha iniciado con rey, soldado, torre y aldeano especializado según los recursos iniciales.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const MAP_SIZE = 40; const CELL_SIZE = 40; 
        let camera = { x: 0, y: 0, zoom: 1.0 };
        let isDragging = false, startX, startY;
        let selectedBuildingType = null;

        const ERAS = [
            { name: "Edad de Piedra", req: { g: 0, w: 0, f: 0, s: 0 } },
            { name: "Edad de Bronce", req: { g: 200, w: 200, f: 200, s: 200 } },
            { name: "Edad Medieval", req: { g: 500, w: 500, f: 500, s: 500 } },
            { name: "Renacimiento", req: { g: 1000, w: 800, f: 800, s: 1000 } },
            { name: "Edad Industrial", req: { g: 2000, w: 1500, f: 1500, s: 2000 } },
            { name: "Imperial Moderna", req: { g: 4000, w: 3000, f: 3000, s: 4000 } },
            { name: "Era Espacial", req: { g: 10000, w: 8000, f: 8000, s: 10000 } }
        ];

        const BLDG_DATA = {
            "Torre": { era: 0, w: 30, s: 50, hp: 400 },
            "Muralla": { era: 0, w: 10, s: 20, hp: 500 },
            "Puerta": { era: 0, w: 20, s: 30, hp: 450 },
            "Centro Urbano": { era: 1, w: 150, s: 150, hp: 800 },
            "Granja": { era: 1, w: 40, s: 10, hp: 200 },
            "Aserradero": { era: 1, w: 50, s: 20, hp: 250 },
            "Mina": { era: 1, w: 50, s: 50, hp: 300 },
            "Muelle": { era: 1, w: 60, s: 20, hp: 300 },
            "Castillo": { era: 2, w: 400, s: 600, hp: 1500 },
            "Iglesia": { era: 2, w: 200, s: 300, hp: 600 }
        };

        let state = getInitialState();

        function getInitialState() {
            let roles = ["cazador", "constructor", "agricultor", "pescador", "leñador", "minero"];
            let initialRole = roles[Math.floor(Math.random() * roles.length)];
            return {
                eraIndex: 0, year: 1,
                resources: { gold: 300, wood: 300, food: 300, stone: 300 },
                terrain: [], fog: [], plagues: [],
                buildings: [ { id: 1, type: "Torre", x: 20, y: 20, hp: 400, maxHp: 400, complete: true } ],
                units: [
                    { id: 'king', type: 'rey', x: 20, y: 20, hp: 500, inTower: true },
                    { id: 1, type: 'soldado', x: 21, y: 20, hp: 100 },
                    { id: 2, type: "civil", role: initialRole, x: 19, y: 20, hp: 100, hasDog: initialRole === 'cazador' }
                ],
                natureResources: [], wildAnimals: [], domesticAnimals: [], pets: [], barbarians: [],
                messages: "Comienzo en la Edad de Piedra. El rey está refugiado en la torre. Aldeano asignado automáticamente."
            };
        }

        function initWorld() {
            state.terrain = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(0));
            state.fog = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(0));
            
            let waterType = Math.floor(Math.random() * 3);
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    if (waterType === 0 && x > 15 && x < 20) state.terrain[y][x] = 3; 
                    else if (waterType === 1 && Math.hypot(x-10, y-10) < 6) state.terrain[y][x] = 3; 
                    else if (waterType === 2 && (y < 4 || x > MAP_SIZE - 5)) state.terrain[y][x] = 7; 
                    else {
                        if (x < 3 || x > MAP_SIZE - 4 || y > MAP_SIZE - 4) state.terrain[y][x] = 7;
                        else if (x > 25 && y > 15 && y < 25) state.terrain[y][x] = 2; 
                        else if (y > 10 && y < 18 && x > 8 && x < 18) state.terrain[y][x] = 8;
                        else state.terrain[y][x] = 0;
                    }
                }
            }
            respawnNature();
        }

        function respawnNature() {
            state.natureResources = []; state.wildAnimals = [];
            let abundanceFactor = Math.max(0.3, 1.2 - (state.eraIndex * 0.15)); 
            
            const wildTypes = ['🦌', '🦆', '🐟', '🦀'];
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    let t = state.terrain[y][x];
                    if (t === 0 && Math.random() < 0.3 * abundanceFactor) state.natureResources.push({x, y, type: 'madera', icon: '🌲'});
                    if (t === 2 && Math.random() < 0.25 * abundanceFactor) state.natureResources.push({x, y, type: 'piedra', icon: '🪨'});
                    if (t === 3 && Math.random() < 0.35 * abundanceFactor) state.natureResources.push({x, y, type: 'comida', icon: Math.random()>0.5?'🐟':'🦀'});
                    
                    if ((t === 0 || t === 1) && Math.random() < 0.015 * abundanceFactor) {
                        state.wildAnimals.push({ x, y, icon: wildTypes[Math.floor(Math.random()*wildTypes.length)] });
                    }
                }
            }
        }

        window.toggleMenu = () => document.getElementById('sidebarMenu').classList.toggle('hidden');

        function renderDynamicUI() {
            let html = "";
            let nextEra = ERAS[state.eraIndex + 1];
            
            if (nextEra) {
                let canAdvance = state.resources.gold >= nextEra.req.g && state.resources.wood >= nextEra.req.w && state.resources.food >= nextEra.req.f && state.resources.stone >= nextEra.req.s;
                if(canAdvance) html += `<button class="btn-primary btn-advance" onclick="advanceEra()">🌟 [ALERTA] ¡Avanzar a ${nextEra.name}!</button>`;
            }

            html += `<strong>Construcción & Infraestructura</strong>`;
            Object.keys(BLDG_DATA).forEach(bName => {
                let b = BLDG_DATA[bName];
                if (state.eraIndex >= b.era) {
                    let activeClass = selectedBuildingType === bName ? 'active-build' : '';
                    html += `<button class="btn-primary ${activeClass}" onclick="selectBuilding('${bName}')">🏛️ ${bName} (${b.w}🌲, ${b.s}🪨)</button>`;
                }
            });

            let milWeapon = state.eraIndex < 4 ? 'Espadas/Lanzas ⚔️' : 'Armas de Fuego 🔫';
            let cavMode = state.eraIndex < 4 ? 'Caballos 🐴' : 'Vehículos 🚗';

            html += `<strong>Militares (${milWeapon} / ${cavMode})</strong>
                     <button class="btn-primary" onclick="recruit('soldado', 40, 20)">🪖 Soldado (40🪙, 20🐟)</button>
                     <button class="btn-primary" onclick="recruit('caballeria', 80, 50)">🏇🏼 Caballería (80🪙, 50🐟)</button>`;

            html += `<strong>Roles de Aldeanos</strong>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('cazador', 50)">🏹 Cazador (+Perro🐕‍🦺)</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('constructor', 50)">🛠️ Constructor</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('agricultor', 50)">👩🏼‍🌾 Agricultor</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('pescador', 50)">🎣 Pescador</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('leñador', 50)">🪓 Leñador</button>
                     <button class="btn-primary btn-civil" onclick="recruitCivilian('minero', 50)">⚒️ Minero</button>`;
                     
            if(state.eraIndex >= 1) {
                html += `<strong>Mascotas & Control</strong>
                         <button class="btn-primary btn-animal" onclick="buyCat()">🐈 Comprar Gato (Anti-Plagas)</button>`;
            }
            
            document.getElementById('dynamicControls').innerHTML = html;
        }

        window.selectBuilding = function(type) {
            selectedBuildingType = selectedBuildingType === type ? null : type;
            renderDynamicUI();
        }

        window.advanceEra = function() {
            let req = ERAS[state.eraIndex + 1].req;
            state.resources.gold -= req.g; state.resources.wood -= req.w; state.resources.food -= req.f; state.resources.stone -= req.s;
            state.eraIndex++;
            state.messages = `🌟 ¡Has avanzado a la ${ERAS[state.eraIndex].name}!`;
            document.getElementById('eraVal').innerText = ERAS[state.eraIndex].name;
            renderDynamicUI(); updateUI();
        }

        window.recruit = function(type, goldCost, foodCost) {
            if (state.resources.gold >= goldCost && state.resources.food >= foodCost) {
                state.resources.gold -= goldCost; state.resources.food -= foodCost;
                let ref = state.buildings[0];
                state.units.push({ id: Date.now(), type: type, x: ref.x+1, y: ref.y, hp: type==='caballeria'?200:100 });
                updateUI();
            } else alert("Recursos insuficientes.");
        }

        window.recruitCivilian = function(role, foodCost) {
            if (state.resources.food >= foodCost) {
                state.resources.food -= foodCost;
                let ref = state.buildings[0];
                state.units.push({ id: Date.now(), type: 'civil', role: role, x: ref.x-1, y: ref.y, hp: 100, hasDog: role === 'cazador' });
                updateUI();
            } else alert("Falta comida.");
        }

        window.buyCat = function() {
            if(state.resources.gold >= 40) {
                state.resources.gold -= 40;
                state.pets.push({ x: 20, y: 20, icon: '🐈' });
                state.plagues = []; 
                state.messages = "🐈 ¡Un gato ha llegado! Las plagas están controladas.";
                updateUI();
            }
        }

        canvas.addEventListener("click", e => {
            if (!selectedBuildingType) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            const mapX = Math.floor(((e.clientX - rect.left) * scaleX / camera.zoom - camera.x) / CELL_SIZE);
            const mapY = Math.floor(((e.clientY - rect.top) * scaleY / camera.zoom - camera.y) / CELL_SIZE);

            if (mapX >= 0 && mapX < MAP_SIZE && mapY >= 0 && mapY < MAP_SIZE) {
                let data = BLDG_DATA[selectedBuildingType];
                if (state.resources.wood >= data.w && state.resources.stone >= data.s) {
                    state.resources.wood -= data.w; state.resources.stone -= data.s;
                    state.buildings.push({ id: Date.now(), type: selectedBuildingType, x: mapX, y: mapY, hp: data.hp, maxHp: data.hp, complete: false });
                    state.messages = `🏗️ Construcción de ${selectedBuildingType} iniciada.`;
                    selectedBuildingType = null;
                    renderDynamicUI(); updateUI();
                } else alert("Recursos insuficientes.");
            }
        });

        function gameLogicTick() {
            let rey = state.units.find(u => u.type === 'rey');
            let torre = state.buildings.find(b => b.type === 'Torre');

            if (torre && rey) {
                let dist = Math.hypot(rey.x - torre.x, rey.y - torre.y);
                if (dist <= 1 && !rey.inTower) {
                    rey.inTower = true;
                    state.messages = "🏰 El rey se ha refugiado en la Torre de forma segura.";
                }
                if (rey.inTower) rey.hp = Math.min(500, rey.hp + 10);
            }

            if (Math.random() < 0.08 && state.pets.length === 0) {
                const pList = ['🐀', '🦗', '🪰', '🪱'];
                state.plagues.push({ x: Math.floor(Math.random()*MAP_SIZE), y: Math.floor(Math.random()*MAP_SIZE), icon: pList[Math.floor(Math.random()*pList.length)] });
                state.messages = "⚠️ ¡Plagas detectadas afectando recursos y salud!";
            }

            let constructors = state.units.filter(u => u.type === 'civil' && u.role === 'constructor').length;
            state.buildings.forEach(b => {
                if(!b.complete && constructors > 0) {
                    b.hp += 15 * constructors;
                    if(b.hp >= b.maxHp) { b.hp = b.maxHp; b.complete = true; }
                }
            });

            state.units.forEach(u => {
                if(u.type === 'civil') {
                    if(u.role === 'leñador') state.resources.wood += 0.8;
                    if(u.role === 'minero') { state.resources.stone += 0.5; state.resources.gold += 0.2; }
                    if(u.role === 'agricultor' || u.role === 'pescador') state.resources.food += 0.8;
                    if(u.role === 'cazador') {
                        let successRate = u.hasDog ? 0.9 : 0.5;
                        if(Math.random() < successRate) state.resources.food += 1.2;
                    }
                    if(Math.random() < 0.2) { u.x += Math.floor(Math.random()*3)-1; u.y += Math.floor(Math.random()*3)-1; }
                }
            });

            state.units = state.units.filter(u => u.hp > 0);
            updateVision(); updateUI();
        }

        function updateVision() {
            for(let y=0; y<MAP_SIZE; y++) for(let x=0; x<MAP_SIZE; x++) if(state.fog[y][x] === 2) state.fog[y][x] = 1;
            state.units.forEach(u => {
                for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++) {
                    let ny = u.y + dy, nx = u.x + dx;
                    if(ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE) state.fog[ny][nx] = 2;
                }
            });
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
            ctx.translate(camera.x, camera.y); ctx.scale(camera.zoom, camera.zoom);

            const colors = { 0: "#253b25", 2: "#b5a375", 3: "#c5d7f5", 7: "#123048", 8: "#6c7a89" };
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    ctx.fillStyle = colors[state.terrain[y][x]] || "#000"; ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = "rgba(0,0,0,0.1)"; ctx.strokeRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }

            state.natureResources.forEach(res => {
                ctx.font = "16px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(res.icon, (res.x+0.5)*CELL_SIZE, (res.y+0.5)*CELL_SIZE);
            });

            state.buildings.forEach(b => {
                let bx = b.x * CELL_SIZE, by = b.y * CELL_SIZE;
                ctx.fillStyle = b.complete ? (b.type==='Torre'?'#7f8c8d':'#27ae60') : '#555';
                ctx.fillRect(bx + 2, by + 2, CELL_SIZE - 4, CELL_SIZE - 4);
            });

            state.wildAnimals.forEach(w => ctx.fillText(w.icon, (w.x+0.5)*CELL_SIZE, (w.y+0.5)*CELL_SIZE));
            state.pets.forEach(p => ctx.fillText(p.icon, (p.x+0.5)*CELL_SIZE, (p.y+0.5)*CELL_SIZE));
            state.plagues.forEach(pl => ctx.fillText(pl.icon, (pl.x+0.5)*CELL_SIZE, (pl.y+0.5)*CELL_SIZE));

            state.units.forEach(u => {
                if(u.type === 'rey') {
                    if(!u.inTower) ctx.fillText('👑', (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                } else if(u.type === 'soldado') {
                    ctx.fillText('🪖', (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                } else if(u.type === 'caballeria') {
                    ctx.fillText('🏇🏼', (u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE);
                } else {
                    ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc((u.x+0.5)*CELL_SIZE, (u.y+0.5)*CELL_SIZE, 7, 0, Math.PI*2); ctx.fill();
                }
            });

            for(let y=0; y<MAP_SIZE; y++) for(let x=0; x<MAP_SIZE; x++) {
                if(state.fog[y][x] === 0) { ctx.fillStyle = "rgba(5, 5, 8, 0.9)"; ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE); }
                else if(state.fog[y][x] === 1) { ctx.fillStyle = "rgba(5, 5, 8, 0.5)"; ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE); }
            }

            ctx.restore(); requestAnimationFrame(renderLoop);
        }

        function updateUI() {
            document.getElementById("goldVal").innerText = Math.floor(state.resources.gold);
            document.getElementById("woodVal").innerText = Math.floor(state.resources.wood);
            document.getElementById("foodVal").innerText = Math.floor(state.resources.food);
            document.getElementById("stoneVal").innerText = Math.floor(state.resources.stone);
            document.getElementById("adviceBox").innerHTML = `<strong>Reporte:</strong> ${state.messages}`;

            let bHtml = ""; state.buildings.forEach(b => bHtml += `<div>🏛️ ${b.type} (${b.complete?'Activo':'Construyendo'})</div>`);
            document.getElementById("buildingsControl").innerHTML = bHtml;

            let uHtml = "";
            let rey = state.units.find(u=>u.type==='rey'); 
            if(rey) uHtml += `<div style="color:gold">👑 Rey ${rey.inTower?'(En Torre 🏰)':''} (${rey.hp} HP)</div>`;
            state.units.filter(u=>u.type!=='rey').forEach(u => uHtml += `<div>• ${u.type==='civil'?`Aldeano (${u.role})${u.hasDog?' 🐕‍🦺':''}`:u.type}</div>`);
            document.getElementById("unitsControl").innerHTML = uHtml;
            renderDynamicUI();
        }

        window.zoomIn = () => camera.zoom = Math.min(camera.zoom + 0.2, 2.5);
        window.zoomOut = () => camera.zoom = Math.max(camera.zoom - 0.2, 0.5);

        const container = document.getElementById("canvasContainer");
        container.addEventListener("mousedown", e => { isDragging = true; startX = e.clientX - camera.x; startY = e.clientY - camera.y; container.style.cursor = "grabbing"; });
        window.addEventListener("mousemove", e => { if(isDragging) { camera.x = e.clientX - startX; camera.y = e.clientY - startY; } });
        window.addEventListener("mouseup", () => { isDragging = false; container.style.cursor = "crosshair"; });

        initWorld(); renderDynamicUI(); updateVision(); updateUI();
        setInterval(() => { 
            state.year++; 
            document.getElementById("yearVal").innerText = state.year;
            if(state.year % 10 === 0) { respawnNature(); state.messages = "🌱 Han pasado 10 años. Los recursos naturales se han regenerado."; }
        }, 10000);
        setInterval(gameLogicTick, 1000);
        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
