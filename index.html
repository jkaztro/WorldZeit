<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WordZeit - Evolución</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --accent-color: #00ff88;
            --panel-bg: #1e1e1e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; 
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #game-container {
            background-color: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        canvas {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 4px;
            display: block;
            image-rendering: pixelated; 
        }

        #ui-panel {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;
        }

        .stat-highlight {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <h1>WORDZEIT</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        <div id="ui-panel">
            Edad: <span class="stat-highlight" id="lbl-age">Piedra</span> | PE: <span id="lbl-pe">0</span><br>
            🪵 Madera: <span id="lbl-wood">0</span> | 🪨 Piedra: <span id="lbl-stone">0</span> | 🪙 Oro: <span id="lbl-gold">0</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 16; 
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        const TERRAIN_COLORS = {
            0: '#1e3f5a', // Agua 
            1: '#c2b280', // Arena/Playa
            2: '#2d5a27', // Pasto/Llanura
            3: '#1b3b18', // Bosque denso
            4: '#5c5c5c'  // Montaña
        };

        let map = [];
        let resources = {}; 
        let avatars = [];

        let inventory = {
            wood: 0,
            stone: 0,
            gold: 0,
            pe: 0
        };

        function generateMap() {
            map = [];
            resources = {};

            for (let y = 0; y < ROWS; y++) {
                let row = [];
                for (let x = 0; x < COLS; x++) {
                    let rand = Math.random();
                    let tile = rand < 0.45 ? 0 : (rand < 0.75 ? 2 : (rand < 0.90 ? 3 : 4));
                    row.push(tile);

                    if (tile === 3 && Math.random() < 0.4) {
                        resources[`${x},${y}`] = 'wood';
                    } else if (tile === 4 && Math.random() < 0.5) {
                        resources[`${x},${y}`] = 'stone';
                    } else if (tile === 2 && Math.random() < 0.05) {
                        resources[`${x},${y}`] = 'gold';
                    }
                }
                map.push(row);
            }

            for(let p = 0; p < 3; p++) {
                let newMap = [];
                for (let y = 0; y < ROWS; y++) {
                    let newRow = [];
                    for (let x = 0; x < COLS; x++) {
                        newRow.push(getMostCommonNeighbor(x, y));
                    }
                    newMap.push(newRow);
                }
                map = newMap;
            }

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (map[y][x] === 2 && hasNeighbor(x, y, 0)) {
                        map[y][x] = 1;
                    }
                }
            }
        }

        function getMostCommonNeighbor(x, y) {
            let counts = {0:0, 1:0, 2:0, 3:0, 4:0};
            for(let dy = -1; dy <= 1; dy++) {
                for(let dx = -1; dx <= 1; dx++) {
                    let nx = x + dx;
                    let ny = y + dy;
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        counts[map[ny][nx]]++;
                    }
                }
            }
            let maxCount = -1;
            let bestTile = map[y][x];
            for(let tile in counts) {
                if(counts[tile] > maxCount) {
                    maxCount = counts[tile];
                    bestTile = parseInt(tile);
                }
            }
            return bestTile;
        }

        function hasNeighbor(x, y, targetTile) {
            for(let dy = -1; dy <= 1; dy++) {
                for(let dx = -1; dx <= 1; dx++) {
                    let nx = x + dx;
                    let ny = y + dy;
                    if(nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        if(map[ny][nx] === targetTile && (dx !== 0 || dy !== 0)) return true;
                    }
                }
            }
            return false;
        }

        function spawnAvatars() {
            avatars = [];
            let spawned = 0;
            while(spawned < 2) {
                let rx = Math.floor(Math.random() * COLS);
                let ry = Math.floor(Math.random() * ROWS);
                if (map[ry][rx] === 2) {
                    avatars.push({
                        x: rx,
                        y: ry,
                        color: spawned === 0 ? '#ff007f' : '#00bfff',
                        moveTimer: 0
                    });
                    spawned++;
                }
            }
        }

        function drawMap() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    ctx.fillStyle = TERRAIN_COLORS[map[y][x]];
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

                    let key = `${x},${y}`;
                    if (resources[key]) {
                        if (resources[key] === 'wood') {
                            ctx.fillStyle = '#8b5a2b';
                            ctx.fillRect(x * TILE_SIZE + 5, y * TILE_SIZE + 5, 6, 6);
                        } else if (resources[key] === 'stone') {
                            ctx.fillStyle = '#aaaaaa';
                            ctx.fillRect(x * TILE_SIZE + 4, y * TILE_SIZE + 4, 8, 8);
                        } else if (resources[key] === 'gold') {
                            ctx.fillStyle = '#ffd700';
                            ctx.fillRect(x * TILE_SIZE + 6, y * TILE_SIZE + 6, 4, 4);
                        }
                    }
                }
            }
        }

        function drawAvatars() {
            for (let i = 0; i < avatars.length; i++) {
                let av = avatars[i];
                ctx.fillStyle = av.color;
                ctx.fillRect(av.x * TILE_SIZE + 3, av.y * TILE_SIZE + 3, TILE_SIZE - 6, TILE_SIZE - 6);
            }
        }

        function updateAvatars() {
            for (let i = 0; i < avatars.length; i++) {
                let av = avatars[i];
                av.moveTimer++;
                
                if (av.moveTimer > 45) {
                    let dx = Math.floor(Math.random() * 3) - 1; 
                    let dy = Math.floor(Math.random() * 3) - 1;
                    
                    let nx = av.x + dx;
                    let ny = av.y + dy;
                    
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && map[ny][nx] !== 0) {
                        av.x = nx;
                        av.y = ny;

                        let key = `${nx},${ny}`;
                        if (resources[key]) {
                            let resType = resources[key];
                            if (resType === 'wood') { inventory.wood += 5; inventory.pe += 2; }
                            if (resType === 'stone') { inventory.stone += 3; inventory.pe += 3; }
                            if (resType === 'gold') { inventory.gold += 1; inventory.pe += 10; }
                            
                            delete resources[key];
                        }
                    }
                    av.moveTimer = 0;
                }
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('lbl-wood').innerText = inventory.wood;
            document.getElementById('lbl-stone').innerText = inventory.stone;
            document.getElementById('lbl-gold').innerText = inventory.gold;
            document.getElementById('lbl-pe').innerText = inventory.pe;

            let ageLabel = "Piedra";
            if (inventory.pe >= 101) ageLabel = "Bronce";
            if (inventory.pe >= 501) ageLabel = "Edad Media";
            document.getElementById('lbl-age').innerText = ageLabel;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateAvatars();
            drawMap();
            drawAvatars();
            requestAnimationFrame(gameLoop);
        }

        generateMap();
        spawnAvatars();
        gameLoop();
    </script>
</body>
</html>
