<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldZeit - Motor Robusto HD</title>
    <style>
        :root {
            --bg-dark: #070709;
            --panel-bg: #111115;
            --border-color: #22222d;
            --accent-green: #00ffcc;
            --accent-gold: #ffd700;
            --accent-warn: #ff4444;
            --text-main: #d0d0d6;
        }

        body {
            margin: 0;
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            color: var(--accent-green);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .dashboard {
            display: flex;
            gap: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            justify-content: center;
            width: 100%;
            max-width: 800px;
        }

        .resource-item span { color: var(--accent-gold); }

        .game-area {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
        }

        .canvas-container {
            position: relative;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #0d0d11;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            flex-grow: 1;
            height: 500px;
            cursor: grab;
        }

        canvas {
            display: block;
            transform-origin: 0 0;
        }

        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .control-panel strong {
            color: var(--accent-green);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-bottom: 4px;
            text-align: center;
        }

        button.btn-primary {
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            color: #0c0c0e;
            border: none;
            padding: 6px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
            font-size: 10px;
        }

        button.btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 8px var(--accent-green);
        }

        button.btn-sm {
            background: #1a1a24;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            cursor: pointer;
            padding: 3px 6px;
            font-size: 10px;
        }

        button.btn-sm:hover {
            background: var(--accent-green);
            color: #000;
        }
        
        .list-container {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid #1a1a24;
            padding: 4px;
            background: #0a0a0d;
        }

        #adviceBox {
            width: 100%;
            max-width: 800px;
            margin-top: 10px;
            background: #16130a;
            border: 1px solid #4d3d00;
            color: #ffda6a;
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>WorldZeit // Advanced Core</h1>
        <div>
            <button class="btn-sm" onclick="zoomIn()">🔍 +</button>
            <button class="btn-sm" onclick="zoomOut()">🔍 -</button>
        </div>
    </header>

    <div class="dashboard" id="mainDashboard">
        <div class="resource-item">Año: <span id="yearVal">1</span></div>
        <div class="resource-item">Oro: <span id="goldVal">150</span></div>
        <div class="resource-item">Madera: <span id="woodVal">150</span></div>
        <div class="resource-item">Comida: <span id="foodVal">150</span></div>
        <div class="resource-item">Piedra: <span id="stoneVal">100</span></div>
    </div>

    <div class="game-area">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas" width="1600" height="1600" style="width: 800px; height: 800px;"></canvas>
        </div>

        <div class="sidebar">
            <div class="control-panel">
                <strong>Construcción</strong>
                <button class="btn-primary" onclick="build('Granja', 30, 20)">🌾 Granja (30M, 20P)</button>
                <button class="btn-primary" onclick="build('Mina', 40, 40)">⛏️ Mina (40M, 40P)</button>
                <button class="btn-primary" onclick="build('Muralla', 15, 25)">🧱 Muralla (15M, 25P)</button>
                
                <strong style="margin-top:10px;">Reclutamiento</strong>
                <button class="btn-primary" onclick="recruit('militar', 30, 20)">⚔️ Soldado (30O, 20C)</button>
                <button class="btn-primary" onclick="recruit('explorador', 20, 15)">👁️ Explorador (20O, 15C)</button>
            </div>

            <div class="control-panel">
                <strong>Estado del Imperio</strong>
                <div class="list-container" id="buildingsControl"></div>
                <div class="list-container" id="unitsControl" style="margin-top:5px;"></div>
            </div>
        </div>
    </div>

    <div id="adviceBox">
        <strong>Reporte:</strong> El motor ha iniciado correctamente. Protege tu Ayuntamiento de las incursiones.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Configuración de Motor
        const MAP_SIZE = 40; 
        const CELL_SIZE = 40; // 1600 / 40
        
        let camera = { x: 0, y: 0, zoom: 1.0 };
        let isDragging = false, startX, startY;

        // Estado del Juego
        let state = {
            year: 1,
            resources: { gold: 150, wood: 150, food: 150, stone: 100 },
            terrain: [],
            fog: [],
            nature: { resources: [], wildlife: [] },
            buildings: [ { id: 1, type: "Ayuntamiento", x: 20, y: 20, hp: 500, maxHp: 500 } ],
            units: [
                { id: 1, type: "civil", role: "leñador", x: 20, y: 21, hp: 100, targetX: 20, targetY: 22 },
                { id: 2, type: "civil", role: "minero", x: 21, y: 20, hp: 100, targetX: 22, targetY: 20 }
            ],
            barbarians: [],
            messages: "Estableciendo campamento base."
        };

        // Generación del Mundo
        function initWorld() {
            state.terrain = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(0));
            state.fog = Array(MAP_SIZE).fill().map(() => Array(MAP_SIZE).fill(0)); 

            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    if (y < 5) state.terrain[y][x] = 3; // Tundra
                    else if (x < 3 || x > MAP_SIZE - 4 || y > MAP_SIZE - 4) state.terrain[y][x] = 7; // Agua
                    else if (x > 25 && y > 15 && y < 25) state.terrain[y][x] = 2; // Desierto
                    else if (y > 10 && y < 18 && x > 8 && x < 18) state.terrain[y][x] = 8; // Montaña
                    else if (x > 5 && x < 15 && y > 22 && y < 32) state.terrain[y][x] = 1; // Bosque
                    else state.terrain[y][x] = 0; // Llanura
                }
            }
            respawnNature();
        }

        function respawnNature() {
            state.nature.resources = [];
            state.nature.wildlife = [];
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    let t = state.terrain[y][x];
                    if (t === 1 && Math.random() < 0.4) state.nature.resources.push({x, y, type: 'arbol'});
                    if (t === 8 && Math.random() < 0.3) state.nature.resources.push({x, y, type: 'piedra'});
                    
                    if ((t === 0 || t === 1) && Math.random() < 0.03) {
                        state.nature.wildlife.push({ x, y, type: 'lobo', hp: 40 });
                    }
                }
            }
        }

        function spawnBarbarians() {
            let spawns = [{x: 5, y: 5}, {x: 35, y: 5}, {x: 5, y: 35}];
            let p = spawns[Math.floor(Math.random() * spawns.length)];
            state.barbarians.push({ id: Date.now(), x: p.x, y: p.y, hp: 100, attackTimer: 0 });
            state.messages = "¡Atención! Se avistaron bárbaros en las fronteras.";
        }

        // Acciones del Jugador
        window.build = function(type, woodCost, stoneCost) {
            if (state.resources.wood >= woodCost && state.resources.stone >= stoneCost) {
                state.resources.wood -= woodCost;
                state.resources.stone -= stoneCost;
                let th = state.buildings.find(b => b.type === 'Ayuntamiento') || state.buildings[0];
                let offset = (type === 'Muralla') ? 3 : 2;
                
                state.buildings.push({
                    id: Date.now(),
                    type: type,
                    x: th.x + Math.floor(Math.random() * (offset*2)) - offset,
                    y: th.y + Math.floor(Math.random() * (offset*2)) - offset,
                    hp: type === 'Muralla' ? 400 : 200,
                    maxHp: type === 'Muralla' ? 400 : 200
                });
                updateUI();
            } else {
                alert(`Requiere: ${woodCost} Madera, ${stoneCost} Piedra.`);
            }
        }

        window.recruit = function(type, goldCost, foodCost) {
            if (state.resources.gold >= goldCost && state.resources.food >= foodCost) {
                state.resources.gold -= goldCost;
                state.resources.food -= foodCost;
                let th = state.buildings.find(b => b.type === 'Ayuntamiento');
                if(!th) return alert("No tienes Ayuntamiento.");

                state.units.push({
                    id: Date.now(),
                    type: type,
                    x: th.x, y: th.y + 1,
                    hp: type === 'militar' ? 150 : 80,
                    targetX: th.x, targetY: th.y + 1
                });
                updateUI();
            } else {
                alert(`Requiere: ${goldCost} Oro, ${foodCost} Comida.`);
            }
        }

        // Lógica de Juego (1 Tick = 1 Segundo)
        function gameLogicTick() {
            // Economía de Edificios y Civiles
            state.buildings.forEach(b => {
                if(b.type === 'Granja') state.resources.food += 0.5;
                if(b.type === 'Mina') { state.resources.stone += 0.4; state.resources.gold += 0.1; }
            });
            state.units.forEach(u => {
                if(u.type === 'civil') {
                    if(u.role === 'leñador') state.resources.wood += 0.5;
                    if(u.role === 'minero') state.resources.gold += 0.3;
                }
            });

            // IA Bárbaros (Buscan atacar el edificio más cercano o el ayuntamiento)
            let th = state.buildings.find(b => b.type === 'Ayuntamiento');
            state.barbarians.forEach(b => {
                if(!th) return;
                
                // Buscar colisión con edificios (las murallas bloquean)
                let targetBldg = state.buildings.find(bldg => Math.abs(bldg.x - b.x) <= 1 && Math.abs(bldg.y - b.y) <= 1);
                
                if (targetBldg) {
                    targetBldg.hp -= 15; // Atacar edificio
                } else {
                    // Moverse hacia ayuntamiento
                    if(b.x < th.x) b.x++; else if(b.x > th.x) b.x--;
                    if(b.y < th.y) b.y++; else if(b.y > th.y) b.y--;
                }
            });

            // IA Militar y Exploradores
            state.units.forEach(u => {
                if (u.type === 'militar') {
                    let target = state.barbarians.find(b => Math.abs(b.x - u.x) <= 5 && Math.abs(b.y - u.y) <= 5);
                    if (target) {
                        if(target.x > u.x) u.x++; else if(target.x < u.x) u.x--;
                        if(target.y > u.y) u.y++; else if(target.y < u.y) u.y--;
                        if(Math.abs(target.x - u.x) <= 1 && Math.abs(target.y - u.y) <= 1) target.hp -= 30;
                    }
                } else if (u.type === 'explorador') {
                    if(Math.random() < 0.6) {
                        u.x += Math.floor(Math.random() * 3) - 1;
                        u.y += Math.floor(Math.random() * 3) - 1;
                        u.x = Math.max(0, Math.min(MAP_SIZE - 1, u.x));
                        u.y = Math.max(0, Math.min(MAP_SIZE - 1, u.y));
                    }
                }
            });

            // IA Fauna (movimiento errático)
            state.nature.wildlife.forEach(w => {
                if(Math.random() < 0.3) {
                    w.x += Math.floor(Math.random() * 3) - 1;
                    w.y += Math.floor(Math.random() * 3) - 1;
                }
            });

            // Limpieza de entidades muertas
            state.barbarians = state.barbarians.filter(b => b.hp > 0);
            let destroyedBldgs = state.buildings.filter(b => b.hp <= 0);
            if(destroyedBldgs.length > 0) {
                state.messages = "¡Un edificio ha sido destruido!";
                if(destroyedBldgs.find(b => b.type === 'Ayuntamiento')) state.messages = "¡EL AYUNTAMIENTO HA CAÍDO! Fin del imperio.";
            }
            state.buildings = state.buildings.filter(b => b.hp > 0);
            state.units = state.units.filter(u => u.hp > 0);

            // Generación aleatoria
            if (state.barbarians.length < 2 && Math.random() < 0.05) spawnBarbarians();

            updateVision();
            updateUI();
        }

        function updateVision() {
            // Disipar niebla vieja
            for(let y=0; y<MAP_SIZE; y++) for(let x=0; x<MAP_SIZE; x++) if(state.fog[y][x] === 2) state.fog[y][x] = 1;
            
            // Vision de unidades
            state.units.forEach(u => {
                let range = u.type === 'explorador' ? 8 : 4;
                for(let dy = -range; dy <= range; dy++) {
                    for(let dx = -range; dx <= range; dx++) {
                        let ny = u.y + dy, nx = u.x + dx;
                        if(ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE) state.fog[ny][nx] = 2;
                    }
                }
            });
            // Vision de edificios
            state.buildings.forEach(b => {
                let range = b.type === 'Ayuntamiento' ? 6 : 2;
                for(let dy = -range; dy <= range; dy++) {
                    for(let dx = -range; dx <= range; dx++) {
                        let ny = b.y + dy, nx = b.x + dx;
                        if(ny >= 0 && ny < MAP_SIZE && nx >= 0 && nx < MAP_SIZE) state.fog[ny][nx] = 2;
                    }
                }
            });
        }

        // Bucle de Renderizado (60 FPS vía requestAnimationFrame)
        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.scale(camera.zoom, camera.zoom);

            // Terreno
            const colors = { 0: "#253b25", 1: "#152d15", 2: "#b5a375", 3: "#c5d7f5", 7: "#123048", 8: "#6c7a89" };
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    ctx.fillStyle = colors[state.terrain[y][x]] || "#000";
                    ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    ctx.strokeStyle = "rgba(0,0,0,0.1)";
                    ctx.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
            }

            // Recursos
            state.nature.resources.forEach(res => {
                let rx = (res.x + 0.5) * CELL_SIZE, ry = (res.y + 0.5) * CELL_SIZE;
                ctx.fillStyle = res.type === 'arbol' ? '#2ecc71' : '#95a5a6';
                ctx.beginPath(); ctx.arc(rx, ry, res.type === 'arbol'? 8 : 5, 0, Math.PI*2); ctx.fill();
            });

            // Fauna
            state.nature.wildlife.forEach(w => {
                ctx.fillStyle = "#e67e22";
                ctx.beginPath(); ctx.arc((w.x + 0.5) * CELL_SIZE, (w.y + 0.5) * CELL_SIZE, 5, 0, Math.PI*2); ctx.fill();
            });

            // Edificios
            state.buildings.forEach(b => {
                let bx = b.x * CELL_SIZE, by = b.y * CELL_SIZE;
                ctx.fillStyle = b.type === 'Ayuntamiento' ? '#8e44ad' : b.type === 'Granja' ? '#27ae60' : b.type === 'Muralla' ? '#7f8c8d' : '#d35400';
                ctx.fillRect(bx + 2, by + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                
                // Barra HP
                ctx.fillStyle = "red"; ctx.fillRect(bx + 4, by - 6, CELL_SIZE - 8, 4);
                ctx.fillStyle = "#0f0"; ctx.fillRect(bx + 4, by - 6, (CELL_SIZE - 8) * (b.hp / b.maxHp), 4);
            });

            // Bárbaros
            state.barbarians.forEach(b => {
                let bx = (b.x + 0.5) * CELL_SIZE, by = (b.y + 0.5) * CELL_SIZE;
                ctx.fillStyle = "#ff4444";
                ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI*2); ctx.fill();
            });

            // Unidades Aliadas
            state.units.forEach(u => {
                let ux = (u.x + 0.5) * CELL_SIZE, uy = (u.y + 0.5) * CELL_SIZE;
                ctx.fillStyle = u.type === 'militar' ? '#3498db' : u.type === 'explorador' ? '#f39c12' : '#00ffcc';
                ctx.beginPath(); ctx.arc(ux, uy, 7, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "#fff"; ctx.stroke();
            });

            // Niebla
            for(let y=0; y<MAP_SIZE; y++) {
                for(let x=0; x<MAP_SIZE; x++) {
                    if(state.fog[y][x] === 0) {
                        ctx.fillStyle = "rgba(5, 5, 8, 0.9)";
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    } else if(state.fog[y][x] === 1) {
                        ctx.fillStyle = "rgba(5, 5, 8, 0.5)";
                        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            ctx.restore();
            requestAnimationFrame(renderLoop);
        }

        // Actualización de Interfaz
        function updateUI() {
            document.getElementById("goldVal").innerText = Math.floor(state.resources.gold);
            document.getElementById("woodVal").innerText = Math.floor(state.resources.wood);
            document.getElementById("foodVal").innerText = Math.floor(state.resources.food);
            document.getElementById("stoneVal").innerText = Math.floor(state.resources.stone);
            document.getElementById("adviceBox").innerHTML = `<strong>Reporte:</strong> ${state.messages}`;

            let bHtml = "";
            state.buildings.forEach(b => bHtml += `<div>🏛️ ${b.type} (${b.hp} HP)</div>`);
            document.getElementById("buildingsControl").innerHTML = bHtml;

            let uHtml = "";
            state.units.forEach(u => uHtml += `<div>• ${u.type} (${u.hp} HP)</div>`);
            document.getElementById("unitsControl").innerHTML = uHtml;
        }

        // Controles de Cámara
        window.zoomIn = () => camera.zoom = Math.min(camera.zoom + 0.2, 2.5);
        window.zoomOut = () => camera.zoom = Math.max(camera.zoom - 0.2, 0.5);

        const container = document.getElementById("canvasContainer");
        container.addEventListener("mousedown", e => {
            isDragging = true;
            startX = e.clientX - camera.x; startY = e.clientY - camera.y;
            container.style.cursor = "grabbing";
        });
        window.addEventListener("mousemove", e => {
            if(!isDragging) return;
            camera.x = e.clientX - startX; camera.y = e.clientY - startY;
        });
        window.addEventListener("mouseup", () => {
            isDragging = false; container.style.cursor = "grab";
        });

        // Inicialización
        initWorld();
        updateVision();
        updateUI();
        
        setInterval(() => { state.year++; document.getElementById("yearVal").innerText = state.year; }, 10000);
        setInterval(gameLogicTick, 1000); // Lógica a 1 tick por segundo
        requestAnimationFrame(renderLoop); // Gráficos fluidos
    </script>
</body>
</html>
